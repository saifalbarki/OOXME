<!doctype html>
<html class="s-route" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#040404" />
    <title>OOXME — Business, organized for growth.</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="assets/Backgrounds/Tall-background.webp" type="image/webp" fetchpriority="high" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/s.css" />
    <script src="js/s.js" defer></script>
  </head>
  <body class="s-page">
    <img
      class="s-page__background-image"
      src="assets/Backgrounds/Tall-background.webp"
      width="3884"
      height="5532"
      alt=""
      aria-hidden="true"
      fetchpriority="high"
      decoding="async"
    />

    <main class="s-page__content">
      <section class="s-page__section s-page__section--intro" aria-labelledby="s-title">
        <p class="s-page__eyebrow" data-s-reveal>OOXME</p>
        <h1 id="s-title" data-s-reveal>Business,<br />organized for growth.</h1>
        <p class="s-page__lead" data-s-reveal>One continuous view of the work, decisions, and momentum shaping your business.</p>
      </section>

      <section class="s-page__section s-page__section--middle" aria-label="A clearer operating view">
        <p class="s-page__statement" data-s-reveal>Clarity across every moving part.</p>
        <p class="s-page__support" data-s-reveal>Built to keep direction visible while the details keep moving.</p>
      </section>

      <section class="s-page__section s-page__section--close" aria-label="Ask OOXME">
        <p class="s-page__eyebrow" data-s-reveal>Start with a question</p>
        <p class="s-page__statement" data-s-reveal>Move from thought<br />to next step.</p>
      </section>
    </main>

    <form class="s-page__composer" data-s-composer novalidate>
      <button class="s-page__icon-button s-page__add" type="button" aria-label="Add context">
        <span aria-hidden="true"></span>
      </button>
      <label class="s-page__input-label">
        <span class="s-page__visually-hidden">Ask OOXME</span>
        <input class="s-page__composer-input" type="text" name="question" placeholder="Type..." autocomplete="off" enterkeyhint="send" />
      </label>
      <button class="s-page__submit" type="submit" aria-label="Submit question">
        <svg class="s-page__submit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 19V5M6 11l6-6 6 6" />
        </svg>
      </button>
      <p class="s-page__composer-status" data-s-composer-status aria-live="polite"></p>
    </form>
  </body>
</html>
