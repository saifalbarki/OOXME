<!doctype html>
<html class="s-route" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>OOXME — Business, organized for growth.</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/x.css" />
    <script src="js/x.js" defer></script>
  </head>
  <body class="s-page">
    <main class="s-page__content">
      <section class="s-page__group s-page__group--typewriter" aria-labelledby="s-title-1">
        <h1 id="s-title-1" class="s-page__group-title" data-s-reveal>Business,<br />organized for growth.</h1>
        <p class="s-page__group-description" data-s-reveal>One continuous view of the work, decisions, and momentum shaping your business.</p>
      </section>

      <section class="s-page__group" aria-labelledby="s-title-2">
        <h2 id="s-title-2" class="s-page__group-title s-page__group-title--statement" data-s-reveal>Clarity across every moving part.</h2>
        <p class="s-page__group-description" data-s-reveal>Built to keep direction visible while the details keep moving.</p>
      </section>

      <section class="s-page__group" aria-labelledby="s-title-3">
        <h2 id="s-title-3" class="s-page__group-title s-page__group-title--statement" data-s-reveal>Move from thought<br />to next step.</h2>
        <p class="s-page__group-description" data-s-reveal>Start with a question.</p>
      </section>
    </main>

    <form class="s-page__composer" data-s-composer novalidate>
      <button class="s-page__icon-button s-page__add" type="button" aria-label="Add context">
        <span aria-hidden="true"></span>
      </button>
      <label class="s-page__input-label">
        <span class="s-page__visually-hidden">Ask OOXME</span>
        <input class="s-page__composer-input" type="text" name="question" placeholder="Type..." autocomplete="off" enterkeyhint="send" />
      </label>
      <button class="s-page__submit" type="submit" aria-label="Submit question">
        <svg class="s-page__submit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 19V5M6 11l6-6 6 6" />
        </svg>
      </button>
      <p class="s-page__composer-status" data-s-composer-status aria-live="polite"></p>
    </form>
  </body>
</html>
