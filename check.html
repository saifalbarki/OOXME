  <body class="s-page s-page--x s-page--check">
    <main class="s-page__content">

        <section class="s-check-options-panel" data-s-check-options-panel aria-label="Assessment options" lang="en" dir="ltr">
          <div class="s-check-options-panel-list" role="radiogroup" aria-label="Assessment options">
            <button class="s-check-test-option" type="button" role="radio" aria-checked="false" data-s-check-test-option="0"><span class="s-check-test-option-circle" aria-hidden="true"></span><span data-s-check-test-option-label></span></button>
            <button class="s-check-test-option" type="button" role="radio" aria-checked="false" data-s-check-test-option="1"><span class="s-check-test-option-circle" aria-hidden="true"></span><span data-s-check-test-option-label></span></button>
            <button class="s-check-test-option" type="button" role="radio" aria-checked="false" data-s-check-test-option="2"><span class="s-check-test-option-circle" aria-hidden="true"></span><span data-s-check-test-option-label></span></button>
          </div>
          <div class="s-check-progress-card-content" data-s-check-progress-card aria-label="Assessment progress" aria-hidden="true" lang="en" dir="ltr">
            <p class="s-check-progress-kicker" data-s-check-progress-kicker></p>
            <p class="s-check-progress-section" data-s-check-progress-section><span data-s-check-progress-question-label></span> <span class="s-check-progress-number" data-s-check-progress-question-number></span> <span class="s-check-progress-separator">-</span> <span data-s-check-progress-section-label></span> <span class="s-check-progress-number" data-s-check-progress-section-number></span></p>
            <p class="s-check-progress-question" data-s-check-progress-question><span data-s-check-progress-total-sections-label></span><span class="s-check-progress-separator">:</span> <span class="s-check-progress-number" data-s-check-progress-total-sections></span></p>
            <p class="s-check-progress-remaining" data-s-check-progress-remaining><span data-s-check-progress-total-questions-label></span><span class="s-check-progress-separator">:</span> <span class="s-check-progress-number" data-s-check-progress-total-questions></span></p>
          </div>
        </section>
        <form class="s-check-composer-row" data-s-check-composer novalidate>
          <div class="s-check-composer-field">
            <button class="s-check-composer-opposite-circle" type="button" data-s-check-progress-toggle aria-expanded="false" aria-label="Show progress"></button>
            <label class="s-check-composer-text-zone">
              <span class="s-page__visually-hidden">Check message</span>
              <input class="s-check-composer-input is-english-input" type="text" name="check-message" placeholder="Type..." autocomplete="off" enterkeyhint="send" maxlength="120" lang="en" dir="ltr" />
            </label>
            <span class="s-check-composer-zone">
              <button class="s-check-composer-send" type="submit" aria-label="Send message"><svg viewBox="3.9 3.9 16.2 16.2" aria-hidden="true" focusable="false"><path d="M12 18V6M6 12l6-6 6 6" /></svg></button>
            </span>
          </div>
        </form>
      </section>
    </main>

    <form class="s-page__composer" data-s-composer novalidate>
      <div class="s-page__composer-menu" data-s-composer-menu aria-hidden="true"></div>
      <section class="s-check-test-bubble" data-s-check-test-bubble lang="en" dir="ltr" aria-label="Assessment question">
        <p class="s-check-test-question" data-s-check-test-question></p>

      <div class="s-check-test-face s-page__icon-button" data-s-check-test-face aria-hidden="true"><svg class="s-page__x-top-bar-eyes" viewBox="0 0 13 13" aria-hidden="true" focusable="false"><g class="s-page__x-face-shell"><g class="s-page__x-face-eyes"><g class="s-page__x-face-eye-motion"><circle cx="3.75" cy="6.5" r="1.85" /><circle cx="9.25" cy="6.5" r="1.85" /></g></g></g></svg></div>
      <div class="s-check-staged-answer" data-s-check-staged-answer aria-hidden="true" lang="en" dir="ltr"><div class="s-check-ooxo-bubble s-check-staged-answer-bubble" data-s-check-staged-answer-text></div><div class="s-check-staged-answer-face s-page__icon-button"><span class="s-check-user-avatar-initial">A</span></div></div>
      <div class="s-check-assessment-history" data-s-check-assessment-history aria-live="polite"><div data-s-check-history-list></div></div>
      <button class="s-page__icon-button s-page__add" type="button" aria-label="OOXME character"><span aria-hidden="true"></span><svg class="s-page__x-top-bar-eyes" viewBox="0 0 13 13" aria-hidden="true" focusable="false" data-s-x-face data-face-state="idle"><g class="s-page__x-face-shell"><g class="s-page__x-face-eyes"><g class="s-page__x-face-eye-motion"><circle cx="3.75" cy="6.5" r="1.85" /><circle cx="9.25" cy="6.5" r="1.85" /></g></g></g></svg></button>
      <label class="s-page__input-label"><span class="s-page__visually-hidden">Ask ooxme</span><input class="s-page__composer-input is-english-input" type="text" name="question" placeholder="Type..." autocomplete="off" enterkeyhint="send" maxlength="120" lang="en" dir="ltr" /></label>
      <button class="s-page__submit s-page__x-top-bar-submit" type="submit" aria-label="Open menu"><svg class="s-page__submit-icon" viewBox="3.9 3.9 16.2 16.2" aria-hidden="true" focusable="false"><path class="s-page__x-top-bar-line s-page__x-top-bar-line--top" d="M4.22 8h15.56" /><path class="s-page__x-top-bar-line s-page__x-top-bar-line--bottom" d="M4.22 16h15.56" /></svg></button>
      <div class="s-page__send-utilities" data-s-send-utilities aria-hidden="true"><button class="s-page__send-utility is-active" type="button" data-s-utility="theme" aria-label="Toggle theme" aria-pressed="true"><span class="s-page__send-utility-inner" aria-hidden="true"></span></button><button class="s-page__send-utility is-active" type="button" data-s-utility="language" aria-label="Toggle language" aria-pressed="true"><span class="s-page__send-utility-inner" aria-hidden="true"></span></button></div>
