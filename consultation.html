<!doctype html>
<html class="consultation-page" lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Consultation | OOXME</title>
    <meta name="description" content="OOXME consultation." />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="brand-management-new-page consultation-page">
    <main class="master-panel-experience consultation-experience">
      <section class="master-panel-screen studio-panel is-active">
        <article class="master-panel brand-management-new-master-panel consultation-master-panel">
          <section class="studio-content consultation-content">
            <div class="homepage-account-panel consultation-selector-shell">
              <div class="homepage-account-selector studio-selector brand-management-new-selector consultation-selector" data-brand-management-selector data-active="work" role="tablist" aria-label="Consultation view">
                <span class="homepage-account-selector-indicator" aria-hidden="true"></span>
                <button type="button" data-brand-management-state="work" role="tab" aria-selected="true"><span data-en="Overview" data-ar="نظرة عامة">Overview</span></button>
                <button type="button" data-brand-management-state="details" role="tab" aria-selected="false"><span data-en="Details" data-ar="التفاصيل">Details</span></button>
              </div>
            </div>
            <div class="consultation-square-card" aria-hidden="true"></div>
          </section>
          <div class="brand-management-contextual-navigation" data-brand-management-contextual>
            <a class="brand-management-contextual-services" href="/" data-brand-management-home aria-label="Home"><img src="assets/icons/New/HOME.svg" alt="" /></a>
            <div class="brand-management-contextual-pill" data-brand-management-pill data-active="work">
              <span class="brand-management-contextual-indicator" aria-hidden="true"></span>
              <button type="button" data-brand-management-context="work" aria-label="Overview" aria-pressed="true"><img src="assets/icons/New/ARROW LEFT 02.svg" alt="" /></button>
              <button type="button" data-brand-management-context="details" aria-label="Details" aria-pressed="false"><img src="assets/icons/New/ARROW RIGHT 02.svg" alt="" /></button>
            </div>
          </div>
        </article>
      </section>
    </main>
    <script src="js/consultation.js"></script>
  </body>
</html>
