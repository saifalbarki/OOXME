<!doctype html>
<html class="consultation-page" lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Consultation | OOXME</title>
    <meta name="description" content="OOXME consultation." />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/numeric-typography.js" defer></script>
  </head>
  <body class="brand-management-new-page consultation-page">
    <main class="master-panel-experience consultation-experience">
      <section class="master-panel-screen studio-panel is-active">
        <article class="master-panel brand-management-new-master-panel consultation-master-panel">
          <section class="studio-content consultation-content">
            <div class="homepage-account-panel consultation-selector-shell">
              <div class="homepage-account-selector studio-selector brand-management-new-selector consultation-selector" data-brand-management-selector data-active="details" role="tablist" aria-label="Consultation view">
                <span class="homepage-account-selector-indicator" aria-hidden="true"></span>
                <button type="button" data-brand-management-state="work" role="tab" aria-selected="false"><span data-en="Overview" data-ar="نظرة عامة">Overview</span></button>
                <button type="button" data-brand-management-state="details" role="tab" aria-selected="true"><span data-en="Book" data-ar="احجز">Book</span></button>
              </div>
            </div>
            <div class="consultation-square-card" aria-hidden="true" hidden></div>
            <section class="consultation-book-card" data-book-card aria-label="Book consultation">
              <section class="consultation-book-stage" data-book-stage="information">
                <div class="consultation-book-stage-heading"><strong data-en="Information" data-ar="المعلومات">Information</strong></div>
                <div class="consultation-book-fields">
                  <label class="consultation-input-field"><input data-book-field="name" type="text" autocomplete="name" required data-en-placeholder="Name" data-ar-placeholder="الاسم" placeholder="Name" /><span class="consultation-field-display is-placeholder" data-book-field-display aria-hidden="true"></span></label>
                  <label class="consultation-input-field"><input data-book-field="email" type="email" autocomplete="email" required data-en-placeholder="Email" data-ar-placeholder="البريد الإلكتروني" placeholder="Email" /><span class="consultation-field-display is-placeholder" data-book-field-display aria-hidden="true"></span></label>
                  <label class="consultation-input-field"><input data-book-field="phone" type="tel" autocomplete="tel" required data-en-placeholder="Phone" data-ar-placeholder="الهاتف" placeholder="Phone" /><span class="consultation-field-display is-placeholder" data-book-field-display aria-hidden="true"></span></label>
                  <label class="consultation-select-field"><select data-book-field="sector" required aria-label="Business Sector"><option value="" data-en="Business Sector" data-ar="قطاع العمل">Business Sector</option><option value="construction" data-en="Construction" data-ar="مقاولات">Construction</option><option value="real-estate" data-en="Real Estate" data-ar="عقارات">Real Estate</option><option value="trading" data-en="Trading" data-ar="تجارة">Trading</option><option value="restaurants" data-en="Restaurants" data-ar="مطاعم">Restaurants</option><option value="retail" data-en="Retail" data-ar="تجزئة">Retail</option><option value="technology" data-en="Technology" data-ar="تقنية">Technology</option><option value="healthcare" data-en="Healthcare" data-ar="صحة">Healthcare</option><option value="education" data-en="Education" data-ar="تعليم">Education</option><option value="professional" data-en="Professional Services" data-ar="خدمات مهنية">Professional Services</option><option value="other" data-en="Other" data-ar="أخرى">Other</option></select><span class="consultation-select-display" data-book-select-display aria-hidden="true"></span></label>
                  <label class="consultation-select-field"><select data-book-field="topic" required aria-label="Consultation Topic"><option value="" data-en="Consultation Topic" data-ar="موضوع الاستشارة">Consultation Topic</option><option value="brand-management" data-en="Brand Management" data-ar="إدارة العلامة">Brand Management</option><option value="business-development" data-en="Business Development" data-ar="تطوير الأعمال">Business Development</option><option value="marketing" data-en="Marketing" data-ar="التسويق">Marketing</option><option value="sales" data-en="Sales" data-ar="المبيعات">Sales</option><option value="operations" data-en="Operations" data-ar="العمليات">Operations</option><option value="other" data-en="Other" data-ar="أخرى">Other</option></select><span class="consultation-select-display" data-book-select-display aria-hidden="true"></span></label>
                  <label class="consultation-input-field"><input data-book-field="additional" type="text" autocomplete="off" data-en-placeholder="Additional Information (optional)" data-ar-placeholder="معلومات إضافية (اختياري)" placeholder="Additional Information (optional)" /><span class="consultation-field-display is-placeholder" data-book-field-display aria-hidden="true"></span></label>
                  <label class="consultation-input-field"><input data-book-field="discount" type="text" autocomplete="off" data-en-placeholder="Discount Code (optional)" data-ar-placeholder="كود الخصم (اختياري)" placeholder="Discount Code (optional)" /><span class="consultation-field-display is-placeholder" data-book-field-display aria-hidden="true"></span></label>
                </div>
              </section>
              <section class="consultation-book-stage" data-book-stage="schedule" hidden>
                <div class="consultation-book-stage-heading"><strong data-en="Schedule" data-ar="الموعد">Schedule</strong></div>
                <div class="consultation-calendar" data-book-calendar aria-label="Consultation calendar">
                  <div class="consultation-calendar-month" data-book-calendar-month aria-live="polite">August 2026</div>
                  <div class="consultation-calendar-weekdays" data-book-calendar-weekdays aria-hidden="true"></div>
                  <div class="consultation-calendar-viewport" data-book-calendar-viewport>
                    <div class="consultation-calendar-days" data-book-calendar-days></div>
                  </div>
                </div>
                <div class="consultation-book-fields consultation-book-schedule-fields">
                  <label class="consultation-select-field"><select data-book-field="time" required aria-label="Time"><option value="" data-en="Time" data-ar="الوقت">Time</option><option value="10:00">10:00</option><option value="14:30">14:30</option><option value="18:00">18:00</option></select><span class="consultation-select-display" data-book-select-display aria-hidden="true"></span></label>
                  <label class="consultation-select-field"><select data-book-field="duration" required aria-label="Duration"><option value="" data-en="Duration" data-ar="المدة">Duration</option><option value="45" data-en="45 minutes" data-ar="45 دقيقة">45 minutes</option><option value="60" data-en="60 minutes" data-ar="60 دقيقة">60 minutes</option><option value="90" data-en="90 minutes" data-ar="90 دقيقة">90 minutes</option></select><span class="consultation-select-display" data-book-select-display aria-hidden="true"></span></label>
                </div>
              </section>
              <section class="consultation-book-stage" data-book-stage="review" hidden>
                <div class="consultation-book-stage-heading"><strong data-en="Review" data-ar="المراجعة">Review</strong></div>
                <p class="consultation-book-review-message" data-en="Your booking has been received. Please review the invoice below and complete the payment process to finalize your booking." data-ar="تم استلام حجزك. يرجى مراجعة الفاتورة أدناه وإتمام عملية الدفع لتثبيت الحجز بشكل نهائي.">Your booking has been received. Please review the invoice below and complete the payment process to finalize your booking.</p>
                <button type="button" class="consultation-book-review-download" data-en="Download Invoice" data-ar="تحميل الفاتورة">Download Invoice</button>
                <dl class="consultation-book-review" data-book-review></dl>
              </section>
            </section>
          </section>
          <div class="brand-management-contextual-navigation" data-brand-management-contextual>
            <a class="brand-management-contextual-services" href="/" data-brand-management-home aria-label="Home"><img src="assets/icons/New/HOME.svg" alt="" /></a>
            <div class="brand-management-contextual-pill" data-brand-management-pill data-active="details">
              <span class="brand-management-contextual-indicator" aria-hidden="true"></span>
              <button type="button" data-brand-management-context="work" aria-label="Previous" aria-pressed="false"><img src="assets/icons/New/ARROW LEFT 02.svg" alt="" /></button>
              <button type="button" data-brand-management-context="details" aria-label="Next" aria-pressed="false"><img src="assets/icons/New/ARROW RIGHT 02.svg" alt="" /></button>
            </div>
          </div>
        </article>
      </section>
    </main>
    <script src="js/consultation.js"></script>
  </body>
</html>
