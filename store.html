<!doctype html>
<html class="s-route s-x-initializing" lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>ooxme store</title>
    <link rel="canonical" href="https://ooxme.com/store" />
    <link rel="icon" href="/assets/logo/Favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/logo/Favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="assets/fonts/TRYToshB-wght-BF677df27a71b87.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/store.css" />
    <link rel="stylesheet" href="css/header.css" />
    <script src="js/top-bar.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/page-controls.js" defer></script>
  </head>
  <body class="s-page s-page--x s-page--store">
    <main class="s-page__content">
      <section class="s-page__section" data-s-section aria-label="OOXME Store">
        <div class="s-page__major-section s-page__major-section--transition-frame" data-s-major-section>
          <section class="s-page__group s-page__store-section s-page__store-section--intro" data-s-group aria-label="Store introduction">
            <div class="s-page__store-layout">
              <article class="s-page__store-card s-page__store-featured-card">
                <div class="s-page__store-image-placeholder s-page__store-image-placeholder--featured s-page__store-hero-panel">
                  <span class="s-page__store-hero-number" data-store-copy="featuredHeroNumber"></span>
                  <span class="s-page__store-hero-word" data-store-copy="featuredHeroWord"></span>
                </div>
                <div class="s-page__store-card-copy">
                  <p class="s-page__store-eyebrow" data-store-copy="featuredLabel"></p>
                  <h2 class="s-page__store-card-title" data-store-copy="featuredName"></h2>
                  <p class="s-page__store-card-description" data-store-copy="featuredCategory"></p>
                  <p class="s-page__store-card-description" data-store-copy="featuredDescription"></p>
                  <div class="s-page__store-product-footer s-page__store-featured-footer">
                    <div class="s-page__store-price-group"><span class="s-page__store-price s-page__store-price--current" data-store-copy="featuredPrice"></span><span class="s-page__store-price s-page__store-price--previous" data-store-copy="featuredPreviousPrice"></span></div>
                    <button class="s-page__store-action s-page__store-view" type="button" data-store-copy="view">View</button>
                  </div>
                </div>
              </article>
            </div>
          </section>
        </div>

        <div class="s-page__major-section s-page__major-section--transition-frame" data-s-major-section>
          <section class="s-page__group s-page__store-section s-page__store-section--products" data-s-group aria-label="Store products">
            <div class="s-page__store-layout s-page__store-layout--products">
              <div class="s-page__store-carousel" data-store-carousel aria-roledescription="carousel">
                <div class="s-page__store-carousel-viewport" data-store-carousel-viewport>
                  <div class="s-page__store-carousel-track" data-store-carousel-track>
                    <article class="s-page__store-card s-page__store-product-card" data-store-product-card>
                      <div class="s-page__store-image-placeholder" aria-hidden="true"></div>
                      <div class="s-page__store-card-copy">
                        <h3 class="s-page__store-card-title" data-store-copy="productOneName"></h3>
                        <p class="s-page__store-eyebrow" data-store-copy="productOneCategory"></p>
                        <p class="s-page__store-card-description" data-store-copy="productOneDescription"></p>
                        <div class="s-page__store-product-footer"><div class="s-page__store-price-group"><span class="s-page__store-price s-page__store-price--current" data-store-copy="productOnePrice"></span></div><button class="s-page__store-action s-page__store-view" type="button" data-store-copy="view"></button></div>
                      </div>
                    </article>
                    <article class="s-page__store-card s-page__store-product-card" data-store-product-card>
                      <div class="s-page__store-image-placeholder" aria-hidden="true"></div>
                      <div class="s-page__store-card-copy">
                        <h3 class="s-page__store-card-title" data-store-copy="productTwoName"></h3>
                        <p class="s-page__store-eyebrow" data-store-copy="productTwoCategory"></p>
                        <p class="s-page__store-card-description" data-store-copy="productTwoDescription"></p>
                        <div class="s-page__store-product-footer"><div class="s-page__store-price-group"><span class="s-page__store-price s-page__store-price--current" data-store-copy="productTwoPrice"></span></div><button class="s-page__store-action s-page__store-view" type="button" data-store-copy="view"></button></div>
                      </div>
                    </article>
                    <article class="s-page__store-card s-page__store-product-card" data-store-product-card>
                      <div class="s-page__store-image-placeholder" aria-hidden="true"></div>
                      <div class="s-page__store-card-copy">
                        <h3 class="s-page__store-card-title" data-store-copy="productThreeName"></h3>
                        <p class="s-page__store-eyebrow" data-store-copy="productThreeCategory"></p>
                        <p class="s-page__store-card-description" data-store-copy="productThreeDescription"></p>
                        <div class="s-page__store-product-footer"><div class="s-page__store-price-group"><span class="s-page__store-price s-page__store-price--current" data-store-copy="productThreePrice"></span></div><button class="s-page__store-action s-page__store-view" type="button" data-store-copy="view"></button></div>
                    </article>
                    <article class="s-page__store-card s-page__store-product-card" data-store-product-card>
                      <div class="s-page__store-image-placeholder" aria-hidden="true"></div>
                      <div class="s-page__store-card-copy">
                        <h3 class="s-page__store-card-title" data-store-copy="productFourName"></h3>
                        <p class="s-page__store-eyebrow" data-store-copy="productFourCategory"></p>
                        <p class="s-page__store-card-description" data-store-copy="productFourDescription"></p>
                        <div class="s-page__store-product-footer"><div class="s-page__store-price-group"><span class="s-page__store-price s-page__store-price--current" data-store-copy="productFourPrice"></span></div><button class="s-page__store-action s-page__store-view" type="button" data-store-copy="view"></button></div>
                      </div>
                    </article>
                  </div>
                </div>
              </div>
            </div>
            <div class="s-page__rpn-carousel-nav" data-store-carousel-controls aria-label="Card navigation">
              <button type="button" data-store-carousel-previous aria-label="Previous product"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.25 3.5 5.75 8l4.5 4.5" /></svg></button>
              <span data-store-carousel-status aria-live="polite">2 / 4</span>
              <button type="button" data-store-carousel-next aria-label="Next product"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5.75 3.5 4.5 4.5-4.5 4.5" /></svg></button>
            </div>
          </section>
        </div>

        <div class="s-page__major-section s-page__major-section--transition-frame" data-s-major-section>
          <section class="s-page__group s-page__store-section s-page__store-section--custom" data-s-group aria-labelledby="store-custom-title">
            <div class="s-page__store-layout">
              <article class="s-page__store-card s-page__store-custom-card">
                <div class="s-page__store-custom-copy">
                  <p class="s-page__store-eyebrow" data-store-copy="customLabel">Custom Products</p>
                  <h2 id="store-custom-title" class="s-page__store-custom-title" data-store-copy="customTitle">Made for you</h2>
                  <p class="s-page__store-card-description" data-store-copy="customDescription">A future space for products shaped around your needs.</p>
                </div>
                <button class="s-page__store-action s-page__store-custom-action" type="button" data-store-copy="customAction">Request a Custom Product</button>
              </article>
            </div>
          </section>
        </div>
      </section>
    </main>

    <form class="s-page__composer" data-s-composer novalidate>
      <div class="s-page__composer-menu" data-s-composer-menu aria-hidden="true">
      </div>
      <button class="s-page__icon-button s-page__add" type="button" aria-label="Add context"><span aria-hidden="true"></span><svg class="s-page__x-top-bar-eyes" viewBox="0 0 13 13" aria-hidden="true" focusable="false" data-s-x-face data-face-state="idle"><g class="s-page__x-face-shell"><g class="s-page__x-face-eyes"><g class="s-page__x-face-eye-motion"><circle cx="3.75" cy="6.5" r="1.85" /><circle cx="9.25" cy="6.5" r="1.85" /></g></g></g></svg></button>
      <label class="s-page__input-label"><span class="s-page__visually-hidden">Ask ooxme</span><input class="s-page__composer-input is-english-input" type="text" name="question" placeholder="Type..." autocomplete="off" enterkeyhint="send" maxlength="120" lang="en" dir="ltr" /></label>
      <button class="s-page__submit s-page__x-top-bar-submit" type="submit" aria-label="Submit question"><svg class="s-page__submit-icon" viewBox="3.9 3.9 16.2 16.2" aria-hidden="true" focusable="false"><path class="s-page__x-top-bar-line s-page__x-top-bar-line--top" d="M4.22 8h15.56" /><path class="s-page__x-top-bar-line s-page__x-top-bar-line--bottom" d="M4.22 16h15.56" /></svg></button>
      <div class="s-page__send-utilities" data-s-send-utilities aria-hidden="true"><button class="s-page__send-utility is-active" type="button" data-s-utility="theme" aria-label="Toggle theme" aria-pressed="true"><span class="s-page__send-utility-inner" aria-hidden="true"></span></button><button class="s-page__send-utility is-active" type="button" data-s-utility="language" aria-label="Toggle language" aria-pressed="true"><span class="s-page__send-utility-inner" aria-hidden="true"></span></button></div>
    </form>
  </body>
</html>
