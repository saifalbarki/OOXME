<!doctype html>
<html data-os-auth-state="pending" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" data-os-theme-color />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" data-os-status-bar-style />
    <title>OOXME OS</title>
    <script>
      (() => {
        try {
          const language = localStorage.getItem('ooxme-os-language') === 'ar' ? 'ar' : 'en';
          const storedTheme = localStorage.getItem('ooxme-os-theme');
          const theme = storedTheme === 'dark' || storedTheme === 'light'
            ? storedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.lang = language;
          document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.dataset.theme = theme;
        } catch (_) {}
      })();
    </script>
    <link rel="stylesheet" href="css/os.css">
  </head>
  <body><section class="os-auth-gate" data-os-auth-gate hidden><form class="os-auth-form" data-os-auth-form><h1 class="os-auth-title">OOXME OS</h1><input type="password" name="password" autocomplete="current-password" required aria-label="Admin password" placeholder="Password"><div class="os-auth-error" data-os-auth-error role="alert"></div><button type="submit">Unlock</button></form></section><button type="button" class="os-edge-control os-edge-control--left" data-os-add aria-label="Open menu" aria-expanded="false" aria-controls="os-side-menu"><span class="os-menu-trigger-icon" aria-hidden="true"></span></button><div class="os-side-menu" id="os-side-menu" aria-hidden="true"><button type="button" data-os-menu-copy-en="Insights" data-os-menu-copy-ar="التحليلات">Insights</button><button type="button" data-os-menu-copy-en="Notifications" data-os-menu-copy-ar="الإشعارات">Notifications</button><button type="button" data-os-menu-copy-en="Promo Codes" data-os-menu-copy-ar="أكواد الخصم">Promo Codes</button><button type="button" data-os-menu-copy-en="Buttons" data-os-menu-copy-ar="الأزرار">Buttons</button><button type="button" data-os-menu-copy-en="Products" data-os-menu-copy-ar="المنتجات">Products</button><button type="button" data-os-menu-copy-en="Consultations" data-os-menu-copy-ar="الاستشارات">Consultations</button><button type="button" data-os-menu-copy-en="Language" data-os-menu-copy-ar="اللغة" data-os-menu-action="language">Language</button><button type="button" data-os-menu-copy-en="Appearance" data-os-menu-copy-ar="المظهر" data-os-menu-action="appearance">Appearance</button><button type="button" data-os-menu-copy-en="Admin" data-os-menu-copy-ar="الإدارة" data-os-menu-action="admin">Admin</button><button type="button" data-os-menu-copy-en="Log Out" data-os-menu-copy-ar="تسجيل الخروج">Log Out</button></div><button type="button" class="os-edge-control os-edge-control--right" data-os-oxo-toggle aria-label="Open controls" aria-expanded="false"><svg class="os-oxo-face s-page__x-top-bar-eyes" viewBox="0 0 13 13" aria-hidden="true" focusable="false"><g class="s-page__x-face-shell"><g class="s-page__x-face-eyes"><g class="s-page__x-face-eye-motion"><circle cx="3.75" cy="6.5" r="1.85"></circle><circle cx="9.25" cy="6.5" r="1.85"></circle></g></g></g></svg></button><div class="os-admin-shell" data-os-admin hidden><div class="os-admin-line" aria-hidden="true"></div><form class="os-admin-form" data-os-admin-form><div class="os-admin-status" data-os-admin-status role="status" aria-live="polite"></div><input name="user" data-admin-field="user" autocomplete="username" required placeholder="New User" aria-label="New User"><div class="os-admin-password"><input type="password" name="currentPassword" data-admin-field="currentPassword" autocomplete="current-password" required placeholder="Current Password" aria-label="Current Password"><button type="button" class="os-auth-eye" data-admin-password-toggle="currentPassword" aria-label="Show password"><span class="os-hugeicon" aria-hidden="true"></span></button></div><div class="os-admin-password"><input type="password" name="newPassword" data-admin-field="newPassword" autocomplete="new-password" required minlength="12" placeholder="New Password" aria-label="New Password"><button type="button" class="os-auth-eye" data-admin-password-toggle="newPassword" aria-label="Show password"><span class="os-hugeicon" aria-hidden="true"></span></button></div><div class="os-admin-password"><input type="password" name="confirmPassword" data-admin-field="confirmPassword" autocomplete="new-password" required minlength="12" placeholder="Confirm New Password" aria-label="Confirm New Password"><button type="button" class="os-auth-eye" data-admin-password-toggle="confirmPassword" aria-label="Show password"><span class="os-hugeicon" aria-hidden="true"></span></button></div><button class="os-notification-main-action" type="submit">Change Credentials</button></form></div><div class="os-panel" data-os-copy-en="Insights" data-os-copy-ar="التحليلات"><button type="button" class="os-panel-handle" aria-label="Expand panel"></button><span class="os-panel-copy">Insights</span><div class="os-insights" aria-hidden="true"><section class="os-insights-section"><h2 class="os-insights-heading" data-os-insights-en="System Status" data-os-insights-ar="حالة النظام">System Status</h2><p class="os-insights-description" data-os-system-description-en="Live service status is not connected." data-os-system-description-ar="بيانات حالة الخدمات المباشرة غير متصلة.">Live service status is not connected.</p><ul class="os-insights-list" data-os-services><li class="os-insights-service"><span class="os-insights-service-name" data-os-service-en="Vercel" data-os-service-ar="Vercel">Vercel</span><span class="os-insights-status" data-status="unknown" aria-label="Unknown status"></span></li><li class="os-insights-service"><span class="os-insights-service-name" data-os-service-en="GitHub" data-os-service-ar="GitHub">GitHub</span><span class="os-insights-status" data-status="unknown" aria-label="Unknown status"></span></li><li class="os-insights-service"><span class="os-insights-service-name" data-os-service-en="YCloud" data-os-service-ar="YCloud">YCloud</span><span class="os-insights-status" data-status="unknown" aria-label="Unknown status"></span></li><li class="os-insights-service"><span class="os-insights-service-name" data-os-service-en="Cloudflare" data-os-service-ar="Cloudflare">Cloudflare</span><span class="os-insights-status" data-status="unknown" aria-label="Unknown status"></span></li><li class="os-insights-service"><span class="os-insights-service-name" data-os-service-en="Gmail" data-os-service-ar="Gmail">Gmail</span><span class="os-insights-status" data-status="unknown" aria-label="Unknown status"></span></li><li class="os-insights-service"><span class="os-insights-service-name" data-os-service-en="Calendar" data-os-service-ar="التقويم">Calendar</span><span class="os-insights-status" data-status="unknown" aria-label="Unknown status"></span></li><li class="os-insights-service"><span class="os-insights-service-name" data-os-service-en="Drive" data-os-service-ar="Drive">Drive</span><span class="os-insights-status" data-status="unknown" aria-label="Unknown status"></span></li></ul></section><section class="os-insights-section"><h2 class="os-insights-heading" data-os-insights-en="Website Status" data-os-insights-ar="حالة الموقع">Website Status</h2><p class="os-insights-description" data-os-website-description-en="Live website telemetry is not connected." data-os-website-description-ar="بيانات الموقع المباشرة غير متصلة.">Live website telemetry is not connected.</p><dl class="os-insights-list"><div class="os-insights-metric"><dt class="os-insights-metric-label" data-os-metric-en="Last Update" data-os-metric-ar="آخر تحديث">Last Update</dt><dd class="os-insights-metric-value" data-os-metric-value="last-update">Unknown</dd></div><div class="os-insights-metric"><dt class="os-insights-metric-label" data-os-metric-en="Uptime" data-os-metric-ar="وقت التشغيل">Uptime</dt></div><div class="os-insights-metric"><dt class="os-insights-metric-label" data-os-metric-en="Response" data-os-metric-ar="الاستجابة">Response</dt><dd class="os-insights-metric-value" data-os-metric-value="response">Unknown</dd></div><div class="os-insights-metric"><dt class="os-insights-metric-label" data-os-metric-en="Version" data-os-metric-ar="الإصدار">Version</dt></div></dl></section></div><div class="os-notifications" aria-hidden="true"></div></div><script src="js/os.js"></script></body>
</html>
