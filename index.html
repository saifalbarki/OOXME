<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OOXME helps businesses grow through smarter operations, stronger branding, optimized workflows, and measurable business development." />
    <meta name="theme-color" content="#37B8FF" />
    <title>OOXME — Let’s Change</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/home.js" defer></script>
    <style>
      .home-page{min-height:100svh;background:#fff;animation:none}
      .home-page .site-header{position:absolute;width:100%;background:transparent;border:0;backdrop-filter:none}
      .home-page .site-header .brand-logo img{filter:none}
      .home-page .site-header .icon-control{display:none}
      .home-page .home-hero{position:relative;display:grid;min-height:100svh;padding:90px 0 clamp(38px,6svh,72px);background:transparent;align-items:stretch;overflow:hidden}
      .home-page .home-hero::before{position:absolute;z-index:0;right:0;bottom:0;left:0;height:25%;content:"";background:#F1F3F7}
      .home-page .home-hero .hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:calc(100svh - 162px);text-align:center}
      .home-page .home-hero h1{margin:0;color:#0d0d0d;font-family:var(--font-main);font-size:clamp(52px,8.2vw,104px);font-style:normal;font-weight:700;letter-spacing:-.075em;line-height:.96}
      .home-page .home-hero .hero-copy{max-width:500px;margin:16px auto 0;color:#8A8A8A;font-size:clamp(15px,1.55vw,19px);font-weight:500;letter-spacing:-.025em;line-height:1.38;text-align:justify;text-align-last:center}
      .home-page .next-button{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;padding:0;border:0;background:transparent;color:#8A8A8A;box-shadow:none;font-family:var(--font-main);font-size:16px;font-weight:700;letter-spacing:-.02em;cursor:pointer;transition:color .28s ease,transform .28s ease}
      .home-page .next-button:hover{color:#0D0D0D;transform:translateY(-2px)}
      .home-page .next-button:active{transform:scale(.97)}
      html[dir="rtl"] .home-page .home-hero h1{font-family:var(--font-arabic);font-size:clamp(50px,7.5vw,92px);letter-spacing:0;line-height:1.18}
      html[dir="rtl"] .home-page .home-hero .hero-copy{font-family:var(--font-arabic);letter-spacing:0;line-height:1.9}
      @media (max-width:768px){.home-page .home-hero{display:grid!important;min-height:100dvh!important;padding:76px 0 max(34px,env(safe-area-inset-bottom))!important;align-items:stretch!important}.home-page .home-hero::before{height:25%}.home-page .home-hero .hero-inner{justify-content:flex-end!important;min-height:calc(100dvh - 110px)!important}.home-page .home-hero h1{font-size:clamp(36px,10vw,44px)}.home-page .home-hero .hero-copy{max-width:330px;margin-top:12px;font-size:14px;line-height:1.36}.home-page .next-button{margin-top:16px;font-size:15px}}
      @media (prefers-reduced-motion:reduce){.home-page{animation:none}.home-page .next-button{transition:none}}
    </style>
  </head>
  <body class="app-page home-page">
    <header class="site-header">
      <div class="shell header-inner">
        <button class="icon-control menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu"><img src="assets/icons/menu.png" alt="" /></button>
        <a class="brand-logo" href="index.html" aria-label="OOXME home"><img src="assets/logo/OX-001-LOGO-black.png" alt="OOXME logo" /></a>
        <button class="icon-control language-toggle" type="button" aria-label="Switch to Arabic"><img src="assets/icons/globe.png" alt="" /></button>
      </div>
    </header>
    <nav id="site-menu" class="site-menu" aria-label="Primary navigation">
      <a href="index.html" data-i18n="navHome">Home</a>
      <a href="portfolio.html" data-i18n="navPortfolio">Portfolio</a>
      <a href="consultation.html" data-i18n="navConsultation">Consultation</a>
    </nav>
    <main>
      <section class="hero home-hero">
        <div class="shell hero-inner">
          <h1 class="text-reveal" data-i18n="headline">Let's Change</h1>
          <p class="hero-copy text-reveal" data-i18n="supporting">OOXME helps businesses grow through smarter operations, stronger branding, optimized workflows, and measurable business development. Transform your company into a scalable, organized, and profitable business.</p>
          <a class="next-button text-reveal" href="portfolio.html" data-next data-i18n="next">Next</a>
        </div>
      </section>
    </main>
  </body>
</html>
