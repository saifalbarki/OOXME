<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OOXME — business development and brand management." />
    <meta name="theme-color" content="#ffffff" />
    <title>OOXME — Business Development Partner</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/home.js" defer></script>
  </head>
  <body class="app-page home-page">
    <header class="site-header">
      <div class="shell header-inner">
        <button class="icon-control menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu"><img src="assets/icons/menu.png" alt="" /></button>
        <a class="brand-logo" href="index.html" aria-label="OOXME home"><img src="assets/logo/OX-001-LOGO-black.png" alt="OOXME logo" /></a>
        <button class="icon-control language-toggle" type="button" aria-label="Switch to Arabic"><img src="assets/icons/globe.png" alt="" /></button>
      </div>
    </header>
    <nav id="site-menu" class="site-menu" aria-label="Primary navigation">
      <a href="index.html" data-i18n="navHome">Home</a>
      <a href="portfolio.html" data-i18n="navPortfolio">Portfolio</a>
      <a href="consultation.html" data-i18n="navConsultation">Consultation</a>
    </nav>
    <main>
      <section class="hero home-hero">
        <div class="shell hero-inner">
          <p class="eyebrow text-reveal" data-i18n="eyebrow">Business Development Partner</p>
          <h1 class="text-reveal" data-i18n="headline"><span class="hero-headline-main">Building Businesses</span><span class="hero-headline-accent">That Lead Markets.</span></h1>
          <p class="hero-copy text-reveal" data-i18n="supporting">We help ambitious businesses grow through strategic business development, brand management, digital experiences, and creative execution—turning ideas into measurable success.</p>
          <div class="language-choices text-reveal" role="group" aria-label="Choose language">
            <button class="primary-button" type="button" data-language-choice="en">English</button>
            <button class="primary-button arabic-choice" type="button" data-language-choice="ar">العربية</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
