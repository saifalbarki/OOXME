<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OOXME is a premium brand management and business development partner." />
    <meta name="theme-color" content="#ffffff" />
    <title>OOXME</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/home.js" defer></script>
    <style>
      html{min-height:100%;background:#fff}
      .home-page{min-width:320px;min-height:100svh;min-height:100dvh;margin:0;padding:0;background:#fff;color:#0d0d0d;font-family:var(--font-main)}
      .home-layout{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:100svh;min-height:100dvh;background:#fff;border:0;outline:0}
      .home-stage{position:relative;z-index:1;flex:0 0 72svh;flex-basis:72dvh;min-height:0;overflow:visible;border:0;outline:0;background:transparent}
      .home-top{position:relative;z-index:1;display:grid;place-items:center;height:calc(15svh);min-height:78px}
      .home-logo{display:block;width:30px;height:auto}
      .dot-field{position:absolute;z-index:0;inset:0;display:block;width:100%;height:100%;background:#fff;pointer-events:auto}
      .home-bottom{position:relative;z-index:1;display:grid;flex:1 0 28svh;place-items:center;min-height:28svh;min-height:28dvh;padding:24px 20px calc(28px + env(safe-area-inset-bottom));border:0;outline:0;background:transparent;text-align:center}
      .home-bottom-inner{position:relative;top:clamp(8px,1.5svh,16px);display:flex;flex-direction:column;align-items:center;width:min(100%,560px)}
      .home-slot{display:grid;width:100%;place-items:center}
      .home-heading-slot{min-height:clamp(46px,7vw,88px)}
      .home-description-slot{min-height:clamp(80px,11vw,112px);margin-top:16px}
      .home-cta-slot{min-height:31px;margin-top:12px}
      .home-bottom h1{margin:0;color:#0d0d0d;font-size:clamp(42px,6.8vw,82px);font-weight:700;letter-spacing:-.075em;line-height:.95}
      .home-description{max-width:520px;margin:0;color:#7f8185;font-size:clamp(13px,1.25vw,17px);font-weight:500;letter-spacing:-.02em;line-height:1.2;text-align:center}
      .home-discover{position:relative;margin:0;color:#071478;font-size:clamp(15px,1.35vw,19px);font-weight:700;letter-spacing:-.03em;transition:color .22s ease,opacity .28s ease,filter .28s ease,transform .28s cubic-bezier(.22,.61,.36,1)}
      .home-discover::after{content:'';position:absolute;bottom:-9px;left:50%;width:var(--cta-underline-width);height:var(--cta-underline-height);border-radius:999px;background:currentColor;transform:translateX(-50%);opacity:.55;transition:transform .22s ease,opacity .22s ease;animation:ctaUnderlineDrift 2.4s cubic-bezier(.22,.61,.36,1) infinite}
      .home-discover:hover{color:#071478;transform:translateY(-2px)}
      .home-discover:hover::after{transform:translateX(-50%) translateY(-1px);opacity:1}
      .home-discover:focus-visible{outline:2px solid #0d0d0d;outline-offset:5px;border-radius:2px}
      .home-reveal{opacity:0;transform:translateY(12px);transition:opacity .75s ease,transform .75s cubic-bezier(.22,.61,.36,1)}
      .home-reveal.is-visible{opacity:1;transform:none}
      @media (min-width:769px){.home-top{min-height:100px}.home-logo{width:38px}.home-bottom{padding:34px 30px 38px}.home-description{margin-top:20px}.home-discover{margin-top:14px}}
      @media (max-height:720px){.home-bottom{padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.home-bottom-inner{top:5px}.home-description-slot{min-height:66px;margin-top:10px}.home-cta-slot{margin-top:11px}.home-bottom h1{font-size:clamp(36px,6vw,54px)}}
      @media (prefers-reduced-motion:reduce){.home-reveal{opacity:1;transform:none;transition:none}.home-discover::after{animation:none}}
    </style>
  </head>
  <body class="app-page home-page">
    <main class="home-layout">
      <section class="home-stage" aria-label="OOXME introduction">
        <header class="home-top">
          <a href="index.html" aria-label="OOXME home"><img class="home-logo" src="assets/logo/OX-001-LOGO-black.png" alt="OOXME" /></a>
        </header>
      </section>
      <canvas class="dot-field" aria-hidden="true"></canvas>
      <section class="home-bottom" aria-labelledby="home-heading">
        <div class="home-bottom-inner home-reveal">
          <div class="home-slot home-heading-slot"><h1 id="home-heading">Hello</h1></div>
          <div class="home-slot home-description-slot"><p class="home-description">OOXME is a premium brand management and business development partner, helping ambitious businesses build clarity, momentum, and lasting value.</p></div>
          <div class="home-slot home-cta-slot"><a class="home-discover" href="portfolio.html">Let's Discover</a></div>
        </div>
      </section>
    </main>
  </body>
</html>
