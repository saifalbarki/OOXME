<!doctype html>
<html class="consultation-page consultation-review-route-page" lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Consultation Review | OOXME</title>
    <meta name="description" content="OOXME consultation review." />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/numeric-typography.js" defer></script>
  </head>
  <body class="brand-management-new-page consultation-page consultation-review-route-page">
    <main class="master-panel-experience consultation-experience">
      <section class="master-panel-screen studio-panel is-active">
        <article class="master-panel brand-management-new-master-panel consultation-master-panel">
          <section class="studio-content consultation-review-route-content">
            <div class="homepage-account-panel consultation-selector-shell">
              <div class="homepage-account-selector studio-selector brand-management-new-selector consultation-selector" data-review-selector data-active="details" role="tablist" aria-label="Consultation view">
                <span class="homepage-account-selector-indicator" aria-hidden="true"></span>
                <button type="button" data-review-overview role="tab" aria-selected="false"><span data-en="Overview" data-ar="نظرة عامة">Overview</span></button>
                <button type="button" role="tab" aria-selected="true"><span data-en="Book" data-ar="احجز">Book</span></button>
              </div>
            </div>
            <section class="consultation-review-route-card" aria-label="Consultation review">
              <section class="consultation-review-route-stage">
                <div class="consultation-review-route-heading"><strong data-en="Review" data-ar="المراجعة">Review</strong></div>
                <dl class="consultation-review-route-list" data-review-route-list></dl>
              </section>
            </section>
          </section>
          <div class="brand-management-contextual-navigation" data-brand-management-contextual>
            <a class="brand-management-contextual-services" href="/" data-review-home aria-label="Home"><img src="assets/icons/New/HOME.svg" alt="" /></a>
            <div class="brand-management-contextual-pill" data-brand-management-pill data-active="details">
              <span class="brand-management-contextual-indicator" aria-hidden="true"></span>
              <button type="button" data-review-back aria-label="Previous"><img src="assets/icons/New/ARROW LEFT 02.svg" alt="" /></button>
              <button type="button" aria-label="Next" disabled><img src="assets/icons/New/ARROW RIGHT 02.svg" alt="" /></button>
            </div>
          </div>
        </article>
      </section>
    </main>
    <script src="js/consultation-review.js"></script>
  </body>
</html>
