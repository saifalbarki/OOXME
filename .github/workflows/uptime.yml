name: OOXME uptime probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record uptime sample
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors --max-time 25 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            https://www.ooxme.com/api/cron/insights-uptime
