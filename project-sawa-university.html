<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>OOXME</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/detail.js" defer></script>
  </head>
  <body class="app-page detail-page" data-detail="project-sawa-university">
    <header class="site-header"><div class="shell header-inner"><button class="icon-control menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open menu"><img src="assets/icons/menu.png" alt="" /></button><a class="brand-logo" href="index.html" aria-label="OOXME home"><img src="assets/logo/OX-001-LOGO-black.png" alt="OOXME logo" /></a><button class="icon-control language-toggle" type="button" aria-label="Switch language"><img src="assets/icons/globe.png" alt="" /></button></div></header>
    <nav id="site-menu" class="site-menu" aria-label="Primary navigation"><a href="index.html" data-nav-home>Home</a><a href="portfolio.html" data-nav-portfolio>Portfolio</a></nav>
    <main>
      <section class="sawa-project content-safe-area" aria-labelledby="sawa-project-title">
        <div class="shell content-safe-shell">
          <div class="sawa-grid">
            <article class="sawa-intro text-reveal">
              <h1 id="sawa-project-title" data-sawa-title>Sawa University</h1>
              <p data-sawa-description>A refined visual identity created for Sawa University, blending academic distinction with a clear, contemporary visual language.</p>
            </article>
            <div class="sawa-carousel-group sawa-project-gallery text-reveal">
              <div class="sawa-carousel" aria-label="Sawa University project gallery">
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/04.webp" alt="Sawa University certificate design" loading="eager" fetchpriority="high" decoding="async" /></figure>
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/01.webp" alt="Sawa University project detail one" loading="lazy" decoding="async" /></figure>
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/02.webp" alt="Sawa University project detail two" loading="lazy" decoding="async" /></figure>
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/03.webp" alt="Sawa University project detail three" loading="lazy" decoding="async" /></figure>
              </div>
              <div class="sawa-carousel-dots" aria-label="Choose a project image">
                <button class="is-active" type="button" aria-label="Show image 1" aria-current="true"></button>
                <button type="button" aria-label="Show image 2"></button>
                <button type="button" aria-label="Show image 3"></button>
                <button type="button" aria-label="Show image 4"></button>
              </div>
              <a class="sawa-next" href="#next-project" aria-label="View the next project"><span aria-hidden="true">↓</span></a>
            </div>
          </div>
        </div>
      </section>
      <section id="next-project" class="sawa-project sawa-project--next content-safe-area" aria-labelledby="next-project-title">
        <div class="shell content-safe-shell">
          <div class="sawa-grid">
            <article class="sawa-intro text-reveal">
              <h2 id="next-project-title">Sawa University Applications</h2>
              <p>A closer look at the certificate system and visual details created for Sawa University.</p>
            </article>
            <div class="sawa-carousel-group sawa-project-gallery text-reveal">
              <div class="sawa-carousel" aria-label="Sawa University applications gallery">
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/01.webp" alt="Sawa University application detail one" loading="lazy" decoding="async" /></figure>
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/02.webp" alt="Sawa University application detail two" loading="lazy" decoding="async" /></figure>
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/03.webp" alt="Sawa University application detail three" loading="lazy" decoding="async" /></figure>
                <figure class="sawa-tile"><img src="assets/projects/Certificate/optimized/04.webp" alt="Sawa University application detail four" loading="lazy" decoding="async" /></figure>
              </div>
              <div class="sawa-carousel-dots" aria-label="Choose a project image">
                <button class="is-active" type="button" aria-label="Show image 1" aria-current="true"></button>
                <button type="button" aria-label="Show image 2"></button>
                <button type="button" aria-label="Show image 3"></button>
                <button type="button" aria-label="Show image 4"></button>
              </div>
            </div>
          </div>
        </div>
      </section>
