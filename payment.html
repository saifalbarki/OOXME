<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Payment — OOXME</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/payment.js" defer></script>
  </head>
  <body class="app-page booking-page payment-page">
    <header class="site-header"><div class="shell header-inner"><a class="icon-control home-control" href="index.html" aria-label="Home"><img src="assets/icons/home.png" alt="" /></a><a class="brand-logo" href="index.html" aria-label="OOXME home"><img src="assets/logo/OX-001-LOGO-black.png" alt="OOXME logo" /></a><button class="icon-control language-toggle" type="button" aria-label="Switch to Arabic"><img src="assets/icons/globe.png" alt="" /></button></div></header>
    <main>
      <section class="booking-intro"><div class="shell booking-intro-inner"><p class="eyebrow text-reveal" data-payment-label>Payment</p><h1 class="text-reveal" data-payment-heading>Choose a Payment Method</h1><p class="hero-copy text-reveal" data-payment-copy>Choose your preferred payment option to complete your consultation booking securely.</p></div></section>
      <section class="booking-section"><div class="shell payment-shell text-reveal"><p class="payment-total" data-payment-total hidden></p><div class="payment-options"><button class="payment-option zaincash-option" type="button" data-zaincash><span class="payment-option-name">ZainCash</span><span class="payment-option-copy" data-zaincash-copy>Pay securely with ZainCash</span><span class="payment-option-number" data-zaincash-number>+9647840440011</span></button><button class="payment-option" type="button" data-qi><span class="payment-option-name">Qi</span><span class="payment-option-copy" data-qi-copy>Pay securely with SuperQi</span><span class="payment-option-number" data-qi-number>+9647721117110</span></button></div><p class="payment-note" data-payment-note>Select your preferred payment method to continue.</p><p class="payment-note payment-confirmation-copy" data-payment-confirmation>Once we confirm your payment has been received, we will email your confirmation and instructions for the consultation meeting.</p><p class="payment-note payment-message" data-payment-message aria-live="polite"></p></div></section>
    </main>
  </body>
</html>
