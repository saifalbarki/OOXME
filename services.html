<!doctype html>
<html class="s-route s-x-initializing" lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>OOXME Services</title>
    <meta name="description" content="OOXME services: Brand Management, Brand Creation, Visual Identity, Design, Technical and Partner Services." />
    <link rel="canonical" href="https://ooxme.com/services" />
    <link rel="icon" href="/assets/logo/Favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/logo/Favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="assets/fonts/TRYToshB-wght-BF677df27a71b87.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/services.css" />
    <script src="js/top-bar.js" defer></script>
    <script src="js/services.js" defer></script>
    <script src="js/page-controls.js" defer></script>
  </head>
  <body class="s-page s-page--services">
    <main class="s-page__content" data-services-content>
      <div class="ooxme-services" data-services-app aria-live="polite"></div>
      <noscript><p class="ooxme-services__noscript">Please enable JavaScript to explore OOXME Services.</p></noscript>
    </main>
    <form class="s-page__composer" data-s-composer novalidate>
      <div class="s-page__composer-menu" data-s-composer-menu aria-hidden="true"></div>
      <button class="s-page__icon-button s-page__add" type="button" aria-label="Go to OOXME"><span aria-hidden="true"></span><svg class="s-page__x-top-bar-eyes" viewBox="0 0 13 13" aria-hidden="true" focusable="false" data-s-x-face data-face-state="idle"><g class="s-page__x-face-shell"><g class="s-page__x-face-eyes"><g class="s-page__x-face-eye-motion"><circle cx="3.75" cy="6.5" r="1.85" /><circle cx="9.25" cy="6.5" r="1.85" /></g></g></g></svg></button>
      <label class="s-page__input-label"><span class="s-page__visually-hidden">Ask ooxme</span><input class="s-page__composer-input is-english-input" type="text" name="question" placeholder="Type..." autocomplete="off" enterkeyhint="send" maxlength="120" lang="en" dir="ltr" /></label>
      <button class="s-page__submit s-page__x-top-bar-submit" type="submit" aria-label="Open menu"><svg class="s-page__submit-icon" viewBox="3.9 3.9 16.2 16.2" aria-hidden="true" focusable="false"><path class="s-page__x-top-bar-line s-page__x-top-bar-line--top" d="M4.22 8h15.56" /><path class="s-page__x-top-bar-line s-page__x-top-bar-line--bottom" d="M4.22 16h15.56" /></svg></button>
      <div class="s-page__send-utilities" data-s-send-utilities aria-hidden="true">
        <button class="s-page__send-utility is-active" type="button" data-s-utility="theme" aria-label="Switch to Day Mode" aria-pressed="true"><span class="s-page__send-utility-inner" aria-hidden="true"></span></button>
        <button class="s-page__send-utility is-active" type="button" data-s-utility="language" aria-label="Switch to Arabic" aria-pressed="true"><span class="s-page__send-utility-inner" aria-hidden="true"></span></button>
      </div>
    </form>
  </body>
</html>
